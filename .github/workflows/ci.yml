name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # Postgres del servicio de cada job. Los tests de la API y los E2E crean
  # sus propias bases (watchlog_test, watchlog_e2e) a partir de esta URL.
  DATABASE_URL: postgresql://watchlog:watchlog@localhost:5432/watchlog

jobs:
  checks:
    name: Lint, typecheck, test y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: watchlog
          POSTGRES_PASSWORD: watchlog
          POSTGRES_DB: watchlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U watchlog" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    # Los espejos de apt a veces se atascan instalando dependencias del navegador.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: watchlog
          POSTGRES_PASSWORD: watchlog
          POSTGRES_DB: watchlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U watchlog" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Solo el headless shell de Chromium (lo que usa Playwright en modo headless), cacheado por versión.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --only-shell chromium
      # apt (lo lento) solo si al runner le falta alguna dependencia del sistema.
      - name: Dependencias del sistema del navegador
        working-directory: apps/web
        run: pnpm exec playwright install-deps --dry-run chromium-headless-shell || pnpm exec playwright install-deps chromium-headless-shell
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  commitlint:
    name: Commits convencionales
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
